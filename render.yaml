# Render Blueprint: API (Docker) + PostgreSQL + frontend static site (separate repo).
# The frontend proxies /api and /uploads to the API, so the browser sees one origin.
# If Render assigns different *.onrender.com hostnames, update the URLs marked "HOSTNAME" below.

services:
  - type: web
    name: businesscard-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: businesscard-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Seed__SuperAdminEmail
        sync: false
      - key: Seed__SuperAdminPassword
        sync: false
      - key: App__PublicCardBaseUrl
        value: https://businesscard-web.onrender.com/v/ # HOSTNAME
      - key: Cors__AllowedOrigins__0
        value: https://businesscard-web.onrender.com # HOSTNAME
    # Free instances have no persistent disk: uploaded photos are lost on every
    # restart/redeploy. For production switch to plan: starter and uncomment:
    # disk:
    #   name: uploads
    #   mountPath: /app/wwwroot/uploads
    #   sizeGB: 1

  - type: web
    name: businesscard-web
    runtime: static
    repo: https://github.com/anarism03/businesscard-frontend
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        value: /api
      - key: VITE_API_PROXY_TARGET
        value: https://businesscard-api.onrender.com # HOSTNAME
    routes:
      - type: rewrite
        source: /api/*
        destination: https://businesscard-api.onrender.com/api/* # HOSTNAME
      - type: rewrite
        source: /uploads/*
        destination: https://businesscard-api.onrender.com/uploads/* # HOSTNAME
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: businesscard-db
    databaseName: businesscard
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
